<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - السكن الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(13, 44, 82, 0.8), rgba(13, 44, 82, 0.9)), url('assets/images/hero.png');
            background-size: cover;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            transition: var(--transition);
        }

        .social-btn:hover {
            background: var(--bg-color);
            border-color: var(--primary-color);
        }

        .divider {
            position: relative;
            margin: 30px 0;
            color: #999;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #eee;
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .auth-footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--light-text);
        }

        .auth-footer a {
            color: var(--accent-color);
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box fade-in">
            <div class="auth-header">
                <a href="index.html" class="logo" style="margin-bottom: 20px; display: block;">
                    <i class="fa-solid fa-city"></i> السكن<span>الفاخر</span>
                </a>
                <h2>مرحباً بعودتك</h2>
                <p>سجل دخولك للمتابعة</p>
            </div>

            <form action="index.html">
                <div class="form-group">
                    <input type="email" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="كلمة المرور" required>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem;">
                    <label style="color: var(--light-text); cursor: pointer;">
                        <input type="checkbox"> تذكرني
                    </label>
                    <a href="forgot-password.html" style="color: var(--primary-color);">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn btn-primary full-width">تسجيل الدخول</button>
            </form>

            <div class="divider">أو سجل عبر</div>

            <div class="social-login">
                <a href="#" class="social-btn"><i class="fa-brands fa-google"></i></a>
                <a href="#" class="social-btn"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#" class="social-btn"><i class="fa-brands fa-twitter"></i></a>
            </div>

            <div class="auth-footer">
                ليس لديك حساب؟ <a href="#">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>
</body>

</html>
