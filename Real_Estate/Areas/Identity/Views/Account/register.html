<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - السكن الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), #0a192f), url('assets/images/hero.png');
            background-blend-mode: overlay;
            background-size: cover;
            padding: 20px;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px 25px;
            border-radius: 25px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .auth-header {
            margin-bottom: 25px;
        }

        .auth-header h2 {
            color: var(--primary-color);
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .auth-header p {
            font-size: 0.9rem;
            color: var(--light-text);
        }

        .form-group input {
            background: #f4f6f9;
            border: 1px solid #e1e1e1;
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 0.9rem;
        }

        .form-group input:focus {
            background: white;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(212, 163, 115, 0.1);
        }

        .divider {
            margin: 20px 0;
            font-size: 0.8rem;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--light-text);
        }

        .auth-footer a {
            color: var(--accent-color);
            font-weight: 600;
        }

        .btn-primary {
            padding: 10px;
            border-radius: 12px;
            font-size: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            margin-bottom: 15px !important;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box fade-in">
            <div class="auth-header">
                <a href="index.html" class="logo" style="margin-bottom: 20px; display: block;">
                    <i class="fa-solid fa-city"></i> السكن<span>الفاخر</span>
                </a>
                <h2>إنشاء حساب جديد</h2>
                <p>انضم إلينا وابدأ رحلتك العقارية</p>
            </div>

            <form action="index.html">
                <div class="form-group">
                    <input type="text" placeholder="الاسم الكامل" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="البريد الإلكتروني" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="كلمة المرور" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="تأكيد كلمة المرور" required>
                </div>

                <div class="form-group" style="text-align: right; font-size: 0.9rem;">
                    <label style="color: var(--light-text); cursor: pointer;">
                        <input type="checkbox" required> أوافق على <a href="#"
                            style="color: var(--primary-color);">الشروط والأحكام</a>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary full-width">تسجيل حساب</button>
            </form>

            <div class="auth-footer">
                لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
            </div>
        </div>
    </div>
</body>

</html>
