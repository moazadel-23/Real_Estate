<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحقق من الرمز - السكن الفاخر</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(13, 44, 82, 0.8), rgba(13, 44, 82, 0.9)), url('assets/images/hero.png');
            background-size: cover;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .auth-header {
            margin-bottom: 30px;
        }

        .auth-header h2 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .auth-footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--light-text);
        }

        .auth-footer a {
            color: var(--accent-color);
            font-weight: 600;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            direction: ltr;
            /* To keep boxes ordered left-to-right or valid for numbers */
        }

        .otp-inputs input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            transition: var(--transition);
        }

        .otp-inputs input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(197, 164, 126, 0.5);
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-box fade-in">
            <div class="auth-header">
                <a href="index.html" class="logo" style="margin-bottom: 20px; display: block;">
                    <i class="fa-solid fa-city"></i> السكن<span>الفاخر</span>
                </a>
                <h2>رمز التحقق</h2>
                <p>أدخل الرمز المكون من 4 أرقام الذي تم إرساله إلى بريدك</p>
            </div>

            <form action="reset-password.html"> <!-- Redirect to home or reset password page -->
                <div class="otp-inputs">
                    <input type="text" maxlength="1" pattern="[0-9]" required
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length >= 1) this.nextElementSibling?.focus()">
                    <input type="text" maxlength="1" pattern="[0-9]" required
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length >= 1) this.nextElementSibling?.focus(); else this.previousElementSibling?.focus()">
                    <input type="text" maxlength="1" pattern="[0-9]" required
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length >= 1) this.nextElementSibling?.focus(); else this.previousElementSibling?.focus()">
                    <input type="text" maxlength="1" pattern="[0-9]" required
                        oninput="this.value = this.value.replace(/[^0-9]/g, ''); if(this.value.length == 0) this.previousElementSibling?.focus()">
                </div>

                <div style="margin-bottom: 20px;">
                    <p style="font-size: 0.9rem; color: #777;">لم يصلك الرمز؟ <a href="#"
                            style="color: var(--primary-color);">إعادة الإرسال</a></p>
                </div>

                <button type="submit" class="btn btn-primary full-width">تحقق</button>
            </form>

            <div class="auth-footer">
                <a href="login.html">العودة لتسجيل الدخول</a>
            </div>
        </div>
    </div>
</body>

</html>
